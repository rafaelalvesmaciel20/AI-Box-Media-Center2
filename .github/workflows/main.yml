
name: Build AI Box Media Center APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Locate project and build APK
        shell: bash
        run: |
          echo "Procurando settings.gradle..."
          SETTINGS="$(find . -maxdepth 6 -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não foi encontrado."
            find . -maxdepth 4 -type f -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "Projeto encontrado em: $PROJECT_DIR"
          gradle -p "$PROJECT_DIR" --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Box-Media-Center-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
