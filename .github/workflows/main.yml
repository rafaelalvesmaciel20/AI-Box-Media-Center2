
      - name: Locate Android project and build APK
        run: |
          echo "Arquivos na raiz:"
          ls -la

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          elif [ -f "./app/gradlew" ]; then
            cd app
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            echo "ERRO: Gradle Wrapper não encontrado."
            echo "Verifique se gradlew e os arquivos Gradle foram enviados ao GitHub."
            find . -maxdepth 4 \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts \) -print
            exit 1
          fi
