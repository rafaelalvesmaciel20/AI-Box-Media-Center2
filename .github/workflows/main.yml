
      - name: Locate Android project and build APK
        shell: bash
        run: |
          echo "Procurando o Gradle Wrapper..."
          find . -maxdepth 5 -type f -name gradlew -print

          WRAPPER="$(find . -maxdepth 5 -type f -name gradlew | head -n 1)"

          if [ -z "$WRAPPER" ]; then
            echo "ERRO: gradlew não foi encontrado."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$WRAPPER")"
          echo "Projeto encontrado em: $PROJECT_DIR"

          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug
